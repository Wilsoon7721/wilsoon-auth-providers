name: Publish

# Publishes when a push to main changes the package version, or on demand.
on:
  push:
    branches: [main]
    paths:
      - wilsoon/package.json
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Run every check and pack the tarball, but publish nothing"
        type: boolean
        default: false

concurrency:
  group: publish
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # A release must resolve auth-core from npm, never from a local checkout.
      - name: Check auth-core comes from npm
        id: linked
        env:
          EVENT: ${{ github.event_name }}
        run: |
          if grep -q 'link:../WilsoonID-NodeSDK' pnpm-workspace.yaml; then
            message="pnpm-workspace.yaml still links the local auth-core. Publish @wilsoon/auth-core 3.0.0 and remove the override first."
            if [ "$EVENT" = "workflow_dispatch" ]; then
              echo "::error::$message"
              exit 1
            fi
            echo "::warning::Not publishing. $message"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Check the version is new
        id: version
        if: steps.linked.outputs.skip != 'true'
        working-directory: wilsoon
        run: |
          spec="$(node -p 'const p = require("./package.json"); `${p.name}@${p.version}`')"
          if npm view "$spec" version --registry https://registry.npmjs.org >/dev/null 2>&1; then
            echo "::notice::$spec is already on npm, nothing to publish."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        if: steps.linked.outputs.skip != 'true' && steps.version.outputs.skip != 'true'

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: steps.linked.outputs.skip != 'true' && steps.version.outputs.skip != 'true'
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Build and check
        if: steps.linked.outputs.skip != 'true' && steps.version.outputs.skip != 'true'
        run: |
          pnpm install --frozen-lockfile --ignore-scripts
          pnpm build
          pnpm typecheck
          pnpm lint
          git diff --exit-code
          pnpm test

      - name: Show what would be published
        if: steps.linked.outputs.skip != 'true' && steps.version.outputs.skip != 'true'
        run: pnpm --filter ./wilsoon publish --dry-run --no-git-checks

      - name: Publish
        if: steps.linked.outputs.skip != 'true' && steps.version.outputs.skip != 'true' && !inputs.dry_run
        env:
          # Needed for the very first publish, because npm only lets a trusted publisher be added to a package that exists.
          # Delete the NPM_TOKEN secret once trusted publishing is set up.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: pnpm --filter ./wilsoon publish --provenance --access public --no-git-checks
